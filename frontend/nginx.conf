server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;

  # The browser only ever calls /api on its own origin; nginx forwards it to the backend.
  # (In AWS the same rule becomes a CloudFront behaviour or load balancer path rule.)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Vite gives built files a content hash in the name, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Any other path is a page of the single-page app (e.g. a shared link to /products/3).
  location / {
    try_files $uri /index.html;
  }
}
